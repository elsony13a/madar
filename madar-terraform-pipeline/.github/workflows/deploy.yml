name: deploy-madar

on:
  push:
    branches: [main]
  workflow_dispatch:

# Set these in the repo first:
#   Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, COGNITO_USER_POOL_ID,
#            COGNITO_CLIENT_ID, MANUAL_PAYMENT_INSTRUCTIONS
#   Variables: AWS_REGION, FRONTEND_ORIGIN, BUCKET_NAME, TABLE_NAME
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_cognito_user_pool_id: ${{ secrets.COGNITO_USER_POOL_ID }}
  TF_VAR_cognito_client_id: ${{ secrets.COGNITO_CLIENT_ID }}
  TF_VAR_frontend_origin: ${{ vars.FRONTEND_ORIGIN }}
  TF_VAR_bucket_name: ${{ vars.BUCKET_NAME }}
  TF_VAR_table_name: ${{ vars.TABLE_NAME }}
  TF_VAR_manual_payment_instructions: ${{ secrets.MANUAL_PAYMENT_INSTRUCTIONS }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      # 1) ECR must exist before any image can be pushed.
      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Create ECR repository only
        working-directory: terraform
        run: terraform apply -auto-approve -target=aws_ecr_repository.app

      # 2) Build the Docker image and push it to ECR, tagged with the commit SHA.
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        working-directory: .
        run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/madar:$IMAGE_TAG -t ${{ steps.ecr.outputs.registry }}/madar:latest .
          docker push ${{ steps.ecr.outputs.registry }}/madar:$IMAGE_TAG
          docker push ${{ steps.ecr.outputs.registry }}/madar:latest

      # 3) Full apply: DynamoDB, S3, cluster, task definition (with the new image), service.
      - name: Terraform apply everything
        working-directory: terraform
        run: terraform apply -auto-approve -var="image_tag=${{ github.sha }}"

      # 4) Wait for the new task and print its public IP (copy it into web/public/vercel.json).
      - name: Wait for task and print public IP
        env:
          CLUSTER: madar
          SERVICE: madar
        run: |
          # Wait until the new deployment fully replaced the old task, so we read the NEW IP.
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          TASK=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" --query 'taskArns[0]' --output text)
          aws ecs wait tasks-running --cluster "$CLUSTER" --tasks "$TASK"
          ENI=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK" --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' --output text)
          IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI" --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
          echo "Backend public IP: $IP"
          echo "Health check: http://$IP:3000/health"
          echo "Update web/public/vercel.json with this IP, then npm run build and redeploy to Vercel."
