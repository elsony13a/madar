:root {
  --ink: #123e36;
  --cream: #f7f5ed;
  --orange: #ed8c58;
  --muted: #64716b;
  --line: #dde2d9;
  --white: #fff;
  --font: "DM Sans", "Noto Sans Arabic", Arial, sans-serif;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: wait;
  opacity: 0.6;
}
a {
  color: inherit;
  text-decoration: none;
}
button {
  color: inherit;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid #c05d2b;
  outline-offset: 4px;
}
.mode-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  background: var(--ink);
  color: #f8f7ee;
  font-size: 11px;
  letter-spacing: 0.01em;
  padding: 8px 20px;
  min-height: 35px;
}
.mode-banner strong {
  display: flex;
  align-items: center;
  gap: 7px;
  letter-spacing: 0.08em;
  font-size: 10px;
  white-space: nowrap;
}
.status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #bddd9e;
}
.header {
  height: 98px;
  max-width: 1320px;
  padding: 0 50px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 35px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: 23px;
  letter-spacing: 0.1em;
  line-height: 1;
}
.brand small {
  display: block;
  font-size: 7px;
  letter-spacing: 0.14em;
  margin-top: 7px;
}
.brand-mark {
  display: block;
  width: 40px;
  height: 40px;
  font-size: 39px;
  letter-spacing: -0.12em;
  position: relative;
}
.brand-mark > span {
  font-size: 24px;
  position: absolute;
  top: -8px;
  right: -4px;
  color: #b15a35;
}
.header nav {
  display: flex;
  gap: 30px;
  height: 100%;
  align-items: center;
}
.nav-link {
  border: 0;
  background: none;
  height: 100%;
  padding: 0;
  font-size: 13px;
  font-weight: 500;
  position: relative;
}
.nav-link.active:after {
  content: "";
  position: absolute;
  bottom: 22px;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--ink);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 25px;
}
.language {
  border: 0;
  background: none;
  font-weight: 600;
  min-height: 44px;
}
.button-outline,
.button-primary {
  border: 1px solid var(--ink);
  border-radius: 4px;
  padding: 12px 23px;
  min-height: 46px;
  font-weight: 600;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 30px;
}
.button-outline {
  background: transparent;
}
.button-primary {
  background: var(--ink);
  color: white;
}
.button-primary:hover {
  background: #205449;
}
.button-primary span {
  font-size: 19px;
}
.hero {
  max-width: 1320px;
  margin: auto;
  padding: 55px 50px 68px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  overflow: hidden;
}
.eyebrow {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  margin: 0 0 22px;
}
.hero h1 {
  font-family: Georgia, "Noto Sans Arabic", serif;
  font-size: clamp(48px, 5.8vw, 82px);
  font-weight: 400;
  line-height: 1.03;
  letter-spacing: -0.045em;
  margin: 0 0 25px;
}
.hero h1 i {
  font-weight: 400;
  color: #548471;
}
.hero-intro {
  max-width: 360px;
  font-size: 15px;
  color: #58665e;
  line-height: 1.8;
  margin-bottom: 28px;
}
.hero-caption {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 10px;
  margin-top: 23px;
  color: #58665e;
}
.mini-star {
  color: #a45431;
  font-size: 22px;
}
.hero-art {
  position: relative;
  min-height: 425px;
  direction: ltr;
}
.hero-card {
  position: absolute;
  width: 232px;
  height: 300px;
  padding: 21px;
  border-radius: 8px;
  box-shadow: 0 15px 40px #123e3612;
}
.hero-card-back {
  background: #e4b7a0;
  left: 4%;
  top: 20px;
  transform: rotate(-12deg);
  color: #6f3422;
}
.hero-card-back > span {
  font-size: 8px;
  letter-spacing: 0.1em;
}
.hero-card-back > b {
  font-family: Georgia, serif;
  display: block;
  font-size: 42px;
  line-height: 1;
  margin-top: 40px;
  font-weight: 400;
}
.tiny-blocks {
  display: flex;
  gap: 10px;
  position: absolute;
  bottom: 25px;
}
.tiny-blocks i {
  width: 42px;
  height: 42px;
  background: #c96d43;
}
.tiny-blocks i:nth-child(2) {
  border-radius: 50%;
  background: #8f472f;
}
.tiny-blocks i:nth-child(3) {
  border-radius: 50% 50% 0 0;
  background: #f1d6b8;
}
.hero-card-front {
  background: #ced8b4;
  left: 37%;
  top: 80px;
  transform: rotate(9deg);
  z-index: 2;
  color: #24422e;
}
.card-mini-top,
.card-mini-bottom {
  display: flex;
  justify-content: space-between;
  font-size: 7px;
  letter-spacing: 0.1em;
}
.sun-disc {
  width: 115px;
  height: 115px;
  margin: 18px auto 12px;
  border-radius: 50%;
  background: #234636;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sun-disc > span {
  font-size: 95px;
  color: #d9e4b7;
  line-height: 1;
}
.hero-card-front > b {
  font-family: Georgia, serif;
  font-size: 29px;
  line-height: 1;
  display: block;
  font-weight: 400;
}
.card-mini-bottom {
  position: absolute;
  bottom: 16px;
  left: 21px;
  right: 21px;
}
.orbit {
  position: absolute;
  border: 1px solid #d6d9c9;
  border-radius: 50%;
  width: 430px;
  height: 320px;
  left: 3%;
  top: 50px;
  transform: rotate(-30deg);
}
.orbit-two {
  transform: rotate(23deg);
  width: 380px;
  left: 7%;
  top: 65px;
}
.floating-star {
  position: absolute;
  right: 8%;
  top: 0;
  font-size: 64px;
  color: #b56643;
  z-index: 3;
}
.floating-label {
  position: absolute;
  z-index: 4;
  left: 0;
  bottom: 11px;
  padding: 14px 20px;
  box-shadow: 0 5px 30px #0000000b;
  background: #fff;
  border-radius: 5px;
  font-size: 10px;
  transform: rotate(-4deg);
  display: flex;
  gap: 13px;
  align-items: center;
}
.floating-label > span {
  background: var(--ink);
  color: white;
  padding: 5px 10px;
  font-size: 18px;
}
.art-note {
  font-size: 7px;
  letter-spacing: 0.12em;
  position: absolute;
  right: 5%;
  bottom: -6px;
  writing-mode: vertical-lr;
}
.topic-strip {
  padding: 19px 30px;
  background: #e9ebdf;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 48px;
  font-size: 12px;
}
.topic-strip > span {
  font-size: 18px;
  color: #7c8e73;
}
.topic-strip b {
  font-weight: 500;
}
.section {
  max-width: 1320px;
  margin: auto;
  padding: 65px 50px;
}
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 30px;
}
.section-heading .eyebrow {
  margin-bottom: 10px;
  color: #7b836b;
}
h2 {
  font-family: Georgia, "Noto Sans Arabic", serif;
  letter-spacing: -0.025em;
  font-size: 32px;
  font-weight: 400;
  line-height: 1.2;
  margin: 0 0 12px;
}
.section-heading p:not(.eyebrow),
.muted {
  font-size: 13px;
  color: var(--muted);
  margin: 0;
}
.search {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid #c9d0c4;
  border-radius: 4px;
  padding: 0 14px;
  width: 285px;
  background: transparent;
}
.search > span {
  font-size: 28px;
}
.search input {
  width: 100%;
  border: 0;
  background: transparent;
  min-width: 0;
  min-height: 48px;
  font-size: 11px;
  color: var(--ink);
  outline-offset: 9px;
}
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 30px 0;
}
.chip {
  border: 1px solid #cdd4c9;
  background: transparent;
  border-radius: 25px;
  min-height: 42px;
  padding: 8px 20px;
  font-size: 12px;
}
.chip.selected {
  background: var(--ink);
  color: white;
  border-color: var(--ink);
}
.course-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 28px 24px;
}
.course-card {
  background: #fff;
  border: 1px solid #dde2d9;
  border-radius: 7px;
  overflow: hidden;
  transition:
    transform 0.2s,
    box-shadow 0.2s;
}
.course-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 28px #123e3610;
}
.card-open {
  display: block;
  background: none;
  border: 0;
  padding: 0;
  text-align: start;
  width: 100%;
  height: 100%;
}
.course-art {
  height: 190px;
  position: relative;
  overflow: hidden;
  direction: ltr;
}
.art-tag {
  position: absolute;
  left: 19px;
  top: 17px;
  z-index: 3;
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 0.12em;
