<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Rewards & Digital Cards Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07060b;
      --glass: rgba(24, 20, 34, 0.62);
      --line: rgba(255, 255, 255, 0.08);
      --gold-line: rgba(245, 196, 81, 0.55);
      --text: #fafaf9;
      --muted: #a8a29e;
      --gold: #f5c451;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 65% 42% at 15% 6%, rgba(245, 196, 81, 0.14), transparent 60%),
        radial-gradient(ellipse 60% 45% at 85% 16%, rgba(217, 70, 239, 0.11), transparent 60%),
        radial-gradient(ellipse 70% 50% at 50% 96%, rgba(20, 184, 166, 0.10), transparent 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Sticky Top Header + Live Review Bar */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 120;
      background: rgba(9, 8, 15, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }

    .top-bar {
      max-width: 1180px;
      margin: 0 auto;
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      font-weight: 600;
      color: #e7e5e4;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .top-status-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 196, 81, 0.14);
      color: var(--gold);
      border: 1px solid rgba(245, 196, 81, 0.35);
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.7px;
      white-space: nowrap;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--gold);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.45; }
    }

    .country-switcher {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .c-btn {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .c-btn.active,
    .c-btn:hover {
      background: rgba(245, 196, 81, 0.14);
      border-color: var(--gold);
      color: #fde68a;
    }

    .top-review-notif {
      max-width: 1180px;
      margin: 0 auto;
      padding: 9px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12.5px;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .top-review-notif.switching {
      opacity: 0;
      transform: translateY(-4px);
    }

    .notif-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .notif-badge {
      background: rgba(245, 196, 81, 0.14);
      color: var(--gold);
      border: 1px solid rgba(245, 196, 81, 0.35);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .notif-author {
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
    }

    .notif-meta {
      color: var(--muted);
      font-size: 11.5px;
      white-space: nowrap;
    }

    .notif-quote {
      color: #d6d3d1;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 420px;
    }

    .notif-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .notif-stars {
      color: var(--gold);
      font-size: 11.5px;
      letter-spacing: 0.5px;
    }

    .notif-card-chip {
      background: rgba(20, 184, 166, 0.14);
      color: #5eead4;
      border: 1px solid rgba(20, 184, 166, 0.32);
      padding: 2px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Hero */
    .hero {
      max-width: 880px;
      margin: 0 auto;
      padding: 46px 20px 24px;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(32px, 4.8vw, 50px);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(125deg, #ffffff 20%, #fde68a 58%, #f5c451 92%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .hero p {
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }

    /* Grid */
    .grid {
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 20px 36px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(315px, 1fr));
      gap: 24px;
    }

    /* Luxury Velvet Glass Card */
    .card {
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.06) 0%, var(--glass) 100%);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .card:hover {
      transform: translateY(-7px);
      border-color: var(--gold-line);
      box-shadow: 0 26px 54px -14px rgba(0, 0, 0, 0.88), 0 0 30px rgba(245, 196, 81, 0.16);
    }

    /* Realistic Virtual Card */
    .real-card {
      border-radius: 20px;
      padding: 20px;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      aspect-ratio: 1.62 / 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.38), 0 14px 26px -8px rgba(0, 0, 0, 0.65);
    }

    .real-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0.04) 44%, transparent 62%);
      pointer-events: none;
    }

    .real-card::after {
      content: "";
      position: absolute;
      width: 195px;
      height: 195px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      bottom: -75px;
      right: -55px;
      pointer-events: none;
    }

    .skin-blue   { background: linear-gradient(135deg, #002875 0%, #0070e0 55%, #00164d 100%); }
    .skin-green  { background: linear-gradient(135deg, #009922 0%, #00d632 52%, #053312 100%); }
    .skin-sky    { background: linear-gradient(135deg, #005bb5 0%, #008cff 55%, #00244d 100%); }
    .skin-dark   { background: linear-gradient(135deg, #27272a 0%, #18181b 55%, #09090b 100%); }
    .skin-amber  { background: linear-gradient(135deg, #b45309 0%, #f59e0b 55%, #78350f 100%); }
    .skin-rose   { background: linear-gradient(135deg, #be123c 0%, #f43f5e 55%, #881337 100%); }

    .rc-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .card-stars {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(6px);
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 11px;
      color: var(--gold);
      letter-spacing: 0.5px;
    }

    .rc-middle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    .emv-chip {
      width: 40px;
      height: 30px;
      border-radius: 6px;
      background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #a16207 100%);
      border: 1px solid rgba(255, 255, 255, 0.45);
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.35);
    }

    .emv-chip::before {
      content: "";
      position: absolute;
      inset: 6px 0;
      border-top: 1px solid rgba(0, 0, 0, 0.28);
      border-bottom: 1px solid rgba(0, 0, 0, 0.28);
    }

    .emv-chip::after {
      content: "";
      position: absolute;
      inset: 0 12px;
      border-left: 1px solid rgba(0, 0, 0, 0.28);
      border-right: 1px solid rgba(0, 0, 0, 0.28);
    }

    .rc-amount {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
    }

    .rc-amount small {
      font-size: 12px;
      font-weight: 700;
      opacity: 0.9;
      margin-left: 4px;
    }

    .rc-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      position: relative;
      z-index: 2;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.4px;
      opacity: 0.92;
    }

    .rc-network {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      background: rgba(255, 255, 255, 0.18);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .card-info {
      padding: 18px 4px 4px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .info-header h2 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    .left-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      background: rgba(245, 196, 81, 0.12);
      border: 1px solid rgba(245, 196, 81, 0.3);
      padding: 2px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .rating-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--muted);
    }

    .stars-inline {
      color: var(--gold);
      letter-spacing: 1px;
      font-size: 13px;
    }

    .rating-inline strong {
      color: #f5f5f4;
      font-weight: 700;
      margin-left: 4px;
    }

    .verified {
      color: #5eead4;
      font-weight: 600;
      font-size: 12px;
    }

    /* Transparent Glass Hover Buttons */
    .claim-btn,
    .final-btn,
    .filter-btn {
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .claim-btn,
    .final-btn {
      width: 100%;
      padding: 14px 18px;
      border-radius: 15px;
      font-size: 14.5px;
      color: #161003;
      background: linear-gradient(135deg, #fde68a 0%, #f5c451 55%, #d99b26 100%);
      border: 1.5px solid transparent;
      box-shadow: 0 8px 24px -6px rgba(245, 196, 81, 0.45);
      text-decoration: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .claim-btn:hover,
    .final-btn:hover {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-color: var(--gold);
      color: #fde68a;
      box-shadow: 0 0 26px rgba(245, 196, 81, 0.35), inset 0 0 12px rgba(245, 196, 81, 0.16);
      transform: translateY(-2px);
    }

    .claim-btn:hover .arrow,
    .final-btn:hover .arrow {
      transform: translateX(4px);
    }

    .arrow {
      transition: transform 0.25s ease;
    }

    /* Live Reviews Section */
    .reviews-section {
      max-width: 1180px;
      width: 100%;
      margin: 0 auto 64px;
      padding: 0 20px;
    }

    .reviews-box {
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.05) 0%, rgba(22, 18, 32, 0.75) 100%);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 28px 22px;
    }

    .reviews-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 22px;
    }

    .reviews-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .reviews-title-wrap h2 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .filter-group {
      display: inline-flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: rgba(245, 196, 81, 0.12);
      border-color: var(--gold);
      color: #fde68a;
    }

    .reviews-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(275px, 1fr));
      gap: 18px;
    }

    .review-card {
      background: rgba(10, 8, 16, 0.68);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.25s ease, transform 0.25s ease;
    }

    .review-card:hover {
      border-color: rgba(245, 196, 81, 0.35);
      transform: translateY(-3px);
    }

    .rev-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .rev-user strong {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .rev-meta {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .gender-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .gender-male {
      background: rgba(96, 165, 250, 0.14);
      color: #93c5fd;
      border: 1px solid rgba(96, 165, 250, 0.3);
    }

    .gender-female {
      background: rgba(244, 114, 182, 0.14);
      color: #f9a8d4;
      border: 1px solid rgba(244, 114, 182, 0.3);
    }

    .rev-stars {
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 1px;
    }

    .rev-text {
      font-size: 13.5px;
      color: #d6d3d1;
      line-height: 1.5;
      flex: 1;
    }

    .rev-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .rev-card-badge {
      color: #5eead4;
      font-weight: 700;
      background: rgba(20, 184, 166, 0.12);
      border: 1px solid rgba(20, 184, 166, 0.28);
      padding: 3px 9px;
      border-radius: 8px;
    }

    .rev-live-time {
      color: var(--muted);
    }

    /* Qualification Modal */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 3, 8, 0.84);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 300;
    }

    .backdrop.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(165deg, rgba(28, 23, 42, 0.96), rgba(11, 9, 18, 0.98));
      border: 1px solid rgba(245, 196, 81, 0.35);
      border-radius: 26px;
      padding: 24px 22px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85);
      animation: pop 0.24s ease-out;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .step-badge {
      font-size: 11px;
      font-weight: 800;
      color: var(--gold);
      background: rgba(245, 196, 81, 0.14);
      border: 1px solid rgba(245, 196, 81, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: transparent;
      border-color: #f87171;
      color: #fca5a5;
    }

    .bar {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .bar-fill {
      height: 100%;
      width: 33%;
      background: linear-gradient(90deg, #f5c451, #5eead4);
      transition: width 0.3s ease;
    }

    .q-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 18px;
      line-height: 1.3;
    }

    .opt-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .opt-btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s ease;
    }

    .opt-yes {
      background: rgba(245, 196, 81, 0.16);
      color: #fde68a;
      border: 1.5px solid rgba(245, 196, 81, 0.45);
    }

    .opt-yes:hover {
      background: transparent;
      border-color: var(--gold);
      color: #ffffff;
      box-shadow: 0 0 18px rgba(245, 196, 81, 0.25);
    }

    .opt-no {
      background: rgba(255, 255, 255, 0.04);
      color: #e7e5e4;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
    }

    .opt-no:hover {
      background: transparent;
      border-color: #fde68a;
      color: #fde68a;
      box-shadow: 0 0 18px rgba(245, 196, 81, 0.2);
    }

    .result-view {
      display: none;
      text-align: center;
      padding: 6px 0;
    }

    .result-view.active {
      display: block;
    }

    .ok-pill {
      display: inline-block;
      background: rgba(20, 184, 166, 0.16);
      color: #5eead4;
      border: 1px solid rgba(20, 184, 166, 0.35);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .result-view h3 {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    footer {
      text-align: center;
      padding: 18px 16px 28px;
      color: #78716c;
      font-size: 11.5px;
    }

    @media (max-width: 768px) {
      .notif-quote {
        max-width: 220px;
      }
      .notif-right {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Top Header + Live Review Bar -->
  <div class="sticky-header">
    <div class="top-bar">
      <div class="top-status-left">
        <span class="live-pill"><span class="dot"></span> <span id="countryBadge">LIVE: USA 🇺🇸</span></span>
        <span id="programSubtitle">2026 Active Reward Program</span>
      </div>
      <div class="country-switcher" id="countrySwitcher">
        <button type="button" class="c-btn active" data-country="US">🇺🇸 USA</button>
        <button type="button" class="c-btn" data-country="DE">🇩🇪 Germany</button>
        <button type="button" class="c-btn" data-country="GB">🇬🇧 UK</button>
        <button type="button" class="c-btn" data-country="FR">🇫🇷 France</button>
      </div>
    </div>

    <div class="top-review-notif" id="topReviewNotif" aria-live="polite">
      <div class="notif-left">

      const list = countryData[activeCountry].reviews;
      const item = list[topRevIndex % list.length];

      document.getElementById("topRevCard").textContent = item.cardName;
    }

    function setCountry(code) {
      if (!allowedCountries.includes(code)) return;
      activeCountry = code;
      topRevIndex = 0;

      document.querySelectorAll(".c-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.country === code);
      });

      renderCards();
      renderReviews();
      updateTopReview();
    }

    // Auto-detect visitor country (fallback to US; maps to US, DE, GB, FR)
    async function detectVisitorCountry() {
      const urlCountry = new URLSearchParams(window.location.search).get("country")?.toUpperCase();
      if (urlCountry && allowedCountries.includes(urlCountry)) {
        setCountry(urlCountry);
        return;
      }

      try {
        const res = await fetch("https://ipapi.co/country/", { cache: "no-store" });
        const code = (await res.text()).trim().toUpperCase();
        if (allowedCountries.includes(code)) {
          setCountry(code);
        } else {
          setCountry("US");
        }
      } catch (_) {
        setCountry("US");
      }
    }

    document.querySelectorAll(".c-btn").forEach(btn => {
      btn.addEventListener("click", () => setCountry(btn.dataset.country));
    });

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.gender;
        renderReviews();
      });
    });

    setInterval(() => {
      const list = countryData[activeCountry].reviews;
      topNotif.classList.add("switching");
      setTimeout(() => {
        topRevIndex = (topRevIndex + 1) % list.length;
        updateTopReview();
        topNotif.classList.remove("switching");
      }, 320);
    }, 4500);

    // Qualification Modal
    const modal = document.getElementById("quizModal");
    const stepLabel = document.getElementById("stepLabel");
    const barFill = document.getElementById("barFill");
    const questionBox = document.getElementById("questionBox");
    const qTitle = document.getElementById("qTitle");
    const optList = document.getElementById("optList");
    const resultBox = document.getElementById("resultBox");
    const resTitle = document.getElementById("resTitle");
    const offerLink = document.getElementById("offerLink");

    let step = 0;
    let activeReward = "";
    let defaultSub = "";

    function getQuestionsForCountry() {
      const cfg = countryData[activeCountry];
      return [
        {
          q: cfg.residencyQuestion,
          opts: [
            { text: cfg.residencyYes, yes: true },
            { text: cfg.residencyNo, yes: false }
          ]
        },
        {
          q: "Which device are you using right now?",
          opts: [
            { text: "Mobile (iOS / Android)", yes: true },
            { text: "Desktop / Laptop", yes: false }
          ]
        },
        {
          q: "Ready to complete 1 quick sponsor step?",
          opts: [
            { text: "Yes, continue now", yes: true },
            { text: "Not right now", yes: false }
          ]
        }
      ];
    }

    function buildFinalOfferUrl() {
      const incomingSub = new URLSearchParams(window.location.search).get("subsource");
      const url = new URL(OFFER_URL);
      url.searchParams.set("subsource", incomingSub || defaultSub);
      return url.toString();
    }

    function renderStep() {
      const questions = getQuestionsForCountry();
      const current = questions[step];
      stepLabel.textContent = `Step ${step + 1} of ${questions.length}`;
      barFill.style.width = `${((step + 1) / questions.length) * 100}%`;
      qTitle.textContent = current.q;
      optList.innerHTML = "";

      current.opts.forEach(o => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = `opt-btn ${o.yes ? "opt-yes" : "opt-no"}`;
        b.innerHTML = `<span>${o.text}</span><span>›</span>`;
        b.onclick = () => {
          if (step < questions.length - 1) {
            step++;
            renderStep();
          } else {
            questionBox.style.display = "none";
            stepLabel.textContent = "Verified";
            barFill.style.width = "100%";
            resTitle.textContent = activeReward;
            offerLink.href = buildFinalOfferUrl();
            resultBox.classList.add("active");
          }
        };
        optList.appendChild(b);
      });
    }

    function bindClaimButtons() {
      document.querySelectorAll(".claim-btn").forEach(btn => {
        btn.onclick = () => {
          activeReward = btn.dataset.reward;
          defaultSub = btn.dataset.defaultSub;
          step = 0;
          resultBox.classList.remove("active");
          questionBox.style.display = "block";
          renderStep();
          modal.classList.add("active");
        };
      });
    }

    document.getElementById("closeBtn").onclick = () => modal.classList.remove("active");
    modal.onclick = e => { if (e.target === modal) modal.classList.remove("active"); };

    // Initial render + visitor geo detection
    setCountry("US");
    detectVisitorCountry();
